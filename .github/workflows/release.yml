name: Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - package.json
      - RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_CONFIG_ALLOW_GIT: all
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify fork update channel and asset hash
        run: npm run verify:release

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} already exists; bump the version for a new release."
            exit 1
          fi
          # scaffold generates its changelog from the version tag even in CI.
          # Main-branch publishing must create that tag before invoking it.
          tag="v${version}"
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
            echo "$tag points to a different commit; do not overwrite it."
            exit 1
          fi
          npm run release -- --yes
