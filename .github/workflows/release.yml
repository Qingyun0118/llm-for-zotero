name: Release Plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - package.json
      - RELEASE_NOTES.md
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_CONFIG_ALLOW_GIT: all
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify fork update channel and asset hash
        run: npm run verify:release

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} already exists; bump the version for a new release."
            exit 1
          fi
          # scaffold generates its changelog from the version tag even in CI.
          # Main-branch publishing must create that tag before invoking it.
          tag="v${version}"
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          tagged_commit=$(git rev-list -n 1 "$tag")
          if [ "$tagged_commit" != "$(git rev-parse HEAD)" ]; then
            # One-time recovery of the first unpublished fork tag: its complete
            # quality gate passed, but bumpp failed before any upload. Preserve
            # that exact commit and use a lease; published tags are never moved.
            if [ "$tag" != "v3.9.12" ] || [ "$tagged_commit" != "8c19de5c584c995388b3d1edd9adc5bdd73bcb08" ]; then
              echo "$tag points to a different commit; do not overwrite it."
              exit 1
            fi
            releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
            if echo "$releases" | jq -e --arg tag "$tag" 'any(.[]; .tag_name == $tag)' >/dev/null; then
              echo "$tag has a release; never move a published version tag."
              exit 1
            fi
            # The authenticated owner created this recovery branch. Actions
            # cannot create an old-workflow tag without workflows permission.
            backup_branch="backup/unpublished-v3.9.12-before-cli-fix"
            backup_commit=$(git ls-remote origin "refs/heads/$backup_branch" | awk '{print $1}')
            if [ "$backup_commit" != "$tagged_commit" ]; then
              echo "The recovery backup branch is missing or points elsewhere."
              exit 1
            fi
            git tag -f "$tag" HEAD
            git push --force-with-lease="refs/tags/$tag:$tagged_commit" origin "refs/tags/$tag"
          fi
          # First fork release needs an upstream history anchor; without it
          # scaffold reads the entire history into Node's default 1 MiB buffer.
          if ! git rev-parse --verify refs/tags/v3.9.11 >/dev/null 2>&1; then
            git tag v3.9.11 ca6aaf58f559df9c165f3403522ebcf822b0629b
          fi
          npm run release -- --yes
