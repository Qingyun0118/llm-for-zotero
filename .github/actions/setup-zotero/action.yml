name: Set up isolated Zotero tests
description: Install the tested Zotero version and its Linux runtime dependencies
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y xvfb x11-xkb-utils xkb-data libasound2t64 libdbus-glib-1-2 libgtk-3-0
        mkdir -p "$RUNNER_TEMP/zotero-test"
        curl --fail --location --retry 3 \
          https://download.zotero.org/client/release/10.0.6/Zotero-10.0.6_linux-x86_64.tar.xz \
          -o "$RUNNER_TEMP/zotero-test.tar.xz"
        tar -xJf "$RUNNER_TEMP/zotero-test.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zotero-test"
        echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=$RUNNER_TEMP/zotero-test/zotero" >> "$GITHUB_ENV"
